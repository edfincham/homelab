image:
  repository: edfincham/onkyo-rpi
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: "onkyo"
fullnameOverride: "onkyo"

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  enabled: true
  type: LoadBalancer
  port: 8080
  targetPort: 8080
  nodePort: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}
